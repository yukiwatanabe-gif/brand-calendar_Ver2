  <script>
  (function() {
    var PW = 'Yogibo2026', KEY = 'yg_auth';
    if (sessionStorage.getItem(KEY) === '1') return;
    document.addEventListener('DOMContentLoaded', function() {
      var overlay = document.createElement('div');
      overlay.style.cssText = 'position:fixed;inset:0;background:#f9fafb;display:flex;align-items:center;justify-content:center;z-index:9999;';
      overlay.innerHTML = '<div style="background:white;border-radius:16px;padding:40px;width:320px;box-shadow:0 4px 24px rgba(0,0,0,0.1);text-align:center;">'
        + '<div style="font-size:32px;margin-bottom:16px;">🔒</div>'
        + '<h2 style="font-size:16px;font-weight:700;color:#111;margin:0 0 4px;">ブランド戦略 施策カレンダー</h2>'
        + '<p style="font-size:13px;color:#6b7280;margin:0 0 20px;">パスワードを入力してください</p>'
        + '<input id="pw-in" type="password" placeholder="パスワード" style="width:100%;box-sizing:border-box;padding:10px 14px;border:1.5px solid #e5e7eb;border-radius:8px;font-size:14px;outline:none;margin-bottom:8px;">'
        + '<div id="pw-err" style="color:#ef4444;font-size:12px;height:18px;margin-bottom:8px;"></div>'
        + '<button id="pw-btn" style="width:100%;padding:10px;background:#1d4ed8;color:white;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;">入力</button>'
        + '</div>';
      document.body.insertBefore(overlay, document.body.firstChild);
      var inp = document.getElementById('pw-in');
      var err = document.getElementById('pw-err');
      function check() {
        if (inp.value === PW) { sessionStorage.setItem(KEY, '1'); overlay.remove(); }
        else { err.textContent = 'パスワードが違います'; inp.value = ''; inp.focus(); }
      }
      document.getElementById('pw-btn').addEventListener('click', check);
      inp.addEventListener('keydown', function(e) { if (e.key === 'Enter') check(); });
      inp.focus();
    });
  })();
  </script>
